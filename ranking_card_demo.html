<script>
document.addEventListener('DOMContentLoaded', function() {
    const moneyAmounts = [5.00, 4.75, 4.50, 4.25, 4.00, 3.75, 3.50, 3.25, 3.00, 2.75, 2.50, 2.25, 2.00, 1.75, 1.50, 1.25, 1.00, 0.75, 0.50, 0.25, 0.00];
    const rankingList = document.getElementById('ranking-list');
    
    let draggedCard = null;
    
    // Build the ranking interface
    function buildRankingList() {
        rankingList.innerHTML = '';
        
        // Add invisible money cards at the extremes
        const allAmounts = [5.25, ...moneyAmounts, -0.25];
        
        allAmounts.forEach((amount, index) => {
            // Drop zone before each money row (except the first)
            if (index > 0) {
                const prevAmount = allAmounts[index - 1];
                const zonePos = (prevAmount + amount) / 2;
                const zone = createDropZone(zonePos);
                rankingList.appendChild(zone);
            }
            
            // Money row
            const moneyRow = document.createElement('div');
            moneyRow.className = 'ranking-row money-row';
            moneyRow.dataset.position = amount;
            moneyRow.dataset.type = 'money';
            
            // Make extreme cards invisible
            if (amount === 5.25 || amount === -0.25) {
                moneyRow.style.visibility = 'hidden';
                moneyRow.style.minHeight = '0px';
                moneyRow.style.margin = '0px';
            }
            
            const moneyCard = document.createElement('div');
            moneyCard.className = 'card money-card';
            moneyCard.textContent = `No report + ${amount.toFixed(2)}`;
            moneyRow.appendChild(moneyCard);
            
            rankingList.appendChild(moneyRow);
        });
        
        // Final drop zone at the bottom
        const lastZonePos = allAmounts[allAmounts.length - 1] - 0.25;
        const lastZone = createDropZone(lastZonePos);
        rankingList.appendChild(lastZone);
    }
    
    function createDropZone(position) {
        const zone = document.createElement('div');
        zone.className = 'drop-zone';
        zone.dataset.position = position;
        zone.dataset.type = 'dropzone';
        return zone;
    }
    
    function createReportRow(position) {
        const reportRow = document.createElement('div');
        reportRow.className = 'ranking-row report-row';
        reportRow.dataset.position = position;
        reportRow.dataset.type = 'report';
        
        const cardsContainer = document.createElement('div');
        cardsContainer.className = 'report-cards-in-row';
        reportRow.appendChild(cardsContainer);
        
        return reportRow;
    }
    
    // Drag and drop handlers
    document.addEventListener('dragstart', function(e) {
        if (e.target.classList.contains('report-card')) {
            draggedCard = e.target;
            e.target.style.opacity = '0.5';
            e.dataTransfer.effectAllowed = 'move';
        }
    });
    
    document.addEventListener('dragend', function(e) {
        if (e.target.classList.contains('report-card')) {
            e.target.style.opacity = '1';
            draggedCard = null;
            
            // Remove all drag-over states
            document.querySelectorAll('.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
        }
    });
    
    document.addEventListener('dragover', function(e) {
        e.preventDefault();
        
        // Clear previous highlights
        document.querySelectorAll('.drag-over').forEach(el => {
            el.classList.remove('drag-over');
        });
        
        // Find what we're over
        const reportRow = e.target.closest('.report-row');
        const moneyRow = e.target.closest('.money-row');
        const dropZone = e.target.closest('.drop-zone');
        
        if (reportRow) {
            reportRow.classList.add('drag-over');
        } else if (moneyRow) {
            moneyRow.classList.add('drag-over');
        } else if (dropZone) {
            dropZone.classList.add('drag-over');
        }
    });
    
    document.addEventListener('drop', function(e) {
        e.preventDefault();
        
        if (!draggedCard) return;
        
        const reportRow = e.target.closest('.report-row');
        const moneyRow = e.target.closest('.money-row');
        const dropZone = e.target.closest('.drop-zone');
        
        let targetRow = null;
        
        if (reportRow) {
            // Drop on existing report row - add to same row
            targetRow = reportRow;
        } else if (moneyRow) {
            // Drop on money row - add to same level
            targetRow = moneyRow;
        } else if (dropZone) {
            // Drop on zone - this is the key part
            const zonePosition = parseFloat(dropZone.dataset.position);
            
            // Get adjacent elements to calculate new zone positions
            const prevElement = dropZone.previousElementSibling;
            const nextElement = dropZone.nextElementSibling;
            
            // Create the report row
            targetRow = createReportRow(zonePosition);
            
            // Replace the drop zone with: [new zone above] [report row] [new zone below]
            rankingList.insertBefore(targetRow, dropZone);
            
            // Create zone above (between prev element and report row)
            if (prevElement && prevElement.dataset && prevElement.dataset.position) {
                const prevPos = parseFloat(prevElement.dataset.position);
                const abovePos = (prevPos + zonePosition) / 2;
                const aboveZone = createDropZone(abovePos);
                rankingList.insertBefore(aboveZone, targetRow);
            }
            
            // Create zone below (between report row and next element)
            if (nextElement && nextElement.dataset && nextElement.dataset.position) {
                const nextPos = parseFloat(nextElement.dataset.position);
                const belowPos = (zonePosition + nextPos) / 2;
                const belowZone = createDropZone(belowPos);
                rankingList.insertBefore(belowZone, nextElement);
            }
            
            // Remove the original drop zone
            dropZone.remove();
        }
        
        if (targetRow) {
            // Get or create cards container
            let cardsContainer = targetRow.querySelector('.report-cards-in-row');
            if (!cardsContainer) {
                cardsContainer = document.createElement('div');
                cardsContainer.className = 'report-cards-in-row';
                // For money rows, insert before the money card
                const moneyCard = targetRow.querySelector('.money-card');
                if (moneyCard) {
                    targetRow.insertBefore(cardsContainer, moneyCard);
                } else {
                    targetRow.insertBefore(cardsContainer, targetRow.firstChild);
                }
            }
            
            // Move or clone the card
            let cardToPlace;
            if (draggedCard.parentElement.id === 'source-cards') {
                // First time placing from source
                cardToPlace = draggedCard.cloneNode(true);
                cardToPlace.classList.add('placed-card');
                draggedCard.style.display = 'none';
            } else {
                // Moving an already placed card
                cardToPlace = draggedCard;
                const oldRow = draggedCard.closest('.report-row');
                if (oldRow && oldRow !== targetRow) {
                    setTimeout(() => {
                        const oldContainer = oldRow.querySelector('.report-cards-in-row');
                        if (oldContainer && oldContainer.children.length === 0) {
                            // Empty row - need to restore a drop zone
                            const oldPrevElement = oldRow.previousElementSibling;
                            const oldNextElement = oldRow.nextElementSibling;
                            
                            // Remove the two zones around the old row
                            if (oldPrevElement && oldPrevElement.classList && oldPrevElement.classList.contains('drop-zone')) {
                                oldPrevElement.remove();
                            }
                            if (oldNextElement && oldNextElement.classList && oldNextElement.classList.contains('drop-zone')) {
                                oldNextElement.remove();
                            }
                            
                            // Find what's now adjacent after removals
                            const newPrev = oldRow.previousElementSibling;
                            const newNext = oldRow.nextElementSibling;
                            
                            // Remove the old row
                            oldRow.remove();
                            
                            // Create a single drop zone to span the gap
                            if (newPrev && newNext && newPrev.dataset && newNext.dataset &&
                                newPrev.dataset.position && newNext.dataset.position) {
                                const newPos = (parseFloat(newPrev.dataset.position) + parseFloat(newNext.dataset.position)) / 2;
                                const newZone = createDropZone(newPos);
                                rankingList.insertBefore(newZone, newNext);
                            }
                        }
                    }, 0);
                }
            }
            
            cardsContainer.appendChild(cardToPlace);
        }
        
        // Clear highlights
        document.querySelectorAll('.drag-over').forEach(el => {
            el.classList.remove('drag-over');
        });
        
        updateRankingDisplay();
    });
    
    // Double-click to remove card
    document.addEventListener('dblclick', function(e) {
        if (e.target.classList.contains('placed-card')) {
            const reportType = e.target.dataset.report;
            const parentRow = e.target.closest('.report-row');
            
            // Show original in source
            const sourceCard = document.querySelector(`#source-cards [data-report="${reportType}"]`);
            if (sourceCard) {
                sourceCard.style.display = 'block';
            }
            
            e.target.remove();
            
            // Check if row is now empty
            if (parentRow) {
                const container = parentRow.querySelector('.report-cards-in-row');
                if (container && container.children.length === 0) {
                    const prevElement = parentRow.previousElementSibling;
                    const nextElement = parentRow.nextElementSibling;
                    
                    // Remove the two zones
                    if (prevElement && prevElement.classList && prevElement.classList.contains('drop-zone')) {
                        prevElement.remove();
                    }
                    if (nextElement && nextElement.classList && nextElement.classList.contains('drop-zone')) {
                        nextElement.remove();
                    }
                    
                    // Find new adjacent elements
                    const newPrev = parentRow.previousElementSibling;
                    const newNext = parentRow.nextElementSibling;
                    
                    // Remove the row
                    parentRow.remove();
                    
                    // Create single zone
                    if (newPrev && newNext && newPrev.dataset && newNext.dataset &&
                        newPrev.dataset.position && newNext.dataset.position) {
                        const newPos = (parseFloat(newPrev.dataset.position) + parseFloat(newNext.dataset.position)) / 2;
                        const newZone = createDropZone(newPos);
                        rankingList.insertBefore(newZone, newNext);
                    }
                }
            }
            
            updateRankingDisplay();
        }
    });
    
    function updateRankingDisplay() {
        // Get all rows in DOM order
        const allRows = rankingList.querySelectorAll('.ranking-row');
        
        let Pos_1 = '';
        let Pos_2 = '';
        let Pos_3 = '';
        let Pos_4 = '';
        let Pos_5 = '';
        
        allRows.forEach(row => {
            const pos = parseFloat(row.dataset.position);
            const cards = row.querySelectorAll('.report-card');
            cards.forEach(card => {
                const report = card.dataset.report;
                if (report === '1') Pos_1 = pos;
                if (report === '2') Pos_2 = pos;
                if (report === '3') Pos_3 = pos;
                if (report === '4') Pos_4 = pos;
                if (report === '5') Pos_5 = pos;
            });
        });
        
        // Update hidden inputs
        document.getElementById('form1').value = Pos_1;
        document.getElementById('form2').value = Pos_2;
        document.getElementById('form3').value = Pos_3;
        document.getElementById('form4').value = Pos_4;
        document.getElementById('form5').value = Pos_5;
        
        // Update display
        document.getElementById('display_1').textContent = Pos_1 === '' ? '' : (Pos_1 === 0 ? '0' : Pos_1);
        document.getElementById('display_2').textContent = Pos_2 === '' ? '' : (Pos_2 === 0 ? '0' : Pos_2);
        document.getElementById('display_3').textContent = Pos_3 === '' ? '' : (Pos_3 === 0 ? '0' : Pos_3);
        document.getElementById('display_4').textContent = Pos_4 === '' ? '' : (Pos_4 === 0 ? '0' : Pos_4);
        document.getElementById('display_5').textContent = Pos_5 === '' ? '' : (Pos_5 === 0 ? '0' : Pos_5);
    }
    
    // Initialize
    buildRankingList();
    updateRankingDisplay();
});
</script>
